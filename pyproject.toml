[project]
name = "comfyui-civitai-imageplus"
version = "0.2.1"
description = "Browse CivitAI images in ComfyUI, preview protected images, edit prompts, and pass selected images into img2img workflows."
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "aiohttp",
  "numpy",
  "Pillow",
]

[project.urls]
Repository = "https://github.com/CovertBannana/ComfyUI_CivitAI_ImagePlus"
Documentation = "https://github.com/CovertBannana/ComfyUI_CivitAI_ImagePlus#readme"
"Bug Tracker" = "https://github.com/CovertBannana/ComfyUI_CivitAI_ImagePlus/issues"

[tool.comfy]
PublisherId = "covertbannana"
DisplayName = "CivitAI ImagePlus"
Icon = ""
